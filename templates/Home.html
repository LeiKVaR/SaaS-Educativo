
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - SaaS Google Drive</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    
</head>
<body>
     <div class="Conteiner-Home">
        <div class="Conteiner-Head">

            <div class="Head-Logo">
                <h2>SaaS Google Drive</h2>
            </div>
            <div class="Head-Detalles">
                <h3>Juan Perez</h3>
                <span>FREE</span>
                <button id="btn-logout" type="button" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">Cerrar sesión</button>
            </div>

        </div>
        <div class="Contenedor-Main">
            <div class="Opciones-Laterales">
                <button id="btn-create-doc">Crear Documento</button>
                <button id="btn-list-drive">Listar Mis Archivos</button>
                <button id="btn-list-google-drive">Explorar Google Drive</button>
                <button id="btn-list-imported">Documentos Importados</button>
            </div>
            <div class="Opciones-Principales">
                <!-- Formulario para crear documentos -->
                <div id="section-create" class="Creacion-Drive" style="display: none;">
                    <h2>Crear Nuevo Documento en Google Drive</h2>
                    <form id="form-create-doc">
                        <div class="form-group">
                            <label for="doc-title">Título del documento:</label>
                            <input type="text" id="doc-title" name="title" placeholder="Ingresa el título del documento" required>
                        </div>
                        <div class="form-group">
                            <label for="doc-type">Tipo de documento:</label>
                            <select id="doc-type" name="type">
                                <option value="document">Google Docs (Documento)</option>
                                <option value="spreadsheet">Google Sheets (Hoja de cálculo)</option>
                                <option value="presentation">Google Slides (Presentación)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary">Crear Documento</button>
                        <button type="button" id="btn-cancel-create" class="btn-secondary">Cancelar</button>
                    </form>
                </div>

                <!-- Área de feedback -->
                <div id="section-feedback" class="Creacion-Drive"></div>
                
                <!-- Lista de archivos del usuario -->
                <div id="section-drive" class="Conteiner-Listar"></div>
                
                <!-- Lista de archivos de Google Drive -->
                <div id="section-google-drive" class="Conteiner-Listar"></div>
                
                <!-- Lista de documentos importados -->
                <div id="section-imported" class="Conteiner-Listar"></div>
            </div>
        </div>
        
    </div>
    <script>
    (function() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = "{% url 'login' %}";
            return;
        }

        const feedback = document.getElementById('section-feedback');
        const sectionCreate = document.getElementById('section-create');
        const sectionDrive = document.getElementById('section-drive');
        const sectionGoogleDrive = document.getElementById('section-google-drive');
        const sectionImported = document.getElementById('section-imported');
        const btnCreate = document.getElementById('btn-create-doc');
        const btnListDrive = document.getElementById('btn-list-drive');
        const btnListGoogleDrive = document.getElementById('btn-list-google-drive');
        const btnListImported = document.getElementById('btn-list-imported');
        const btnLogout = document.getElementById('btn-logout');
        const formCreateDoc = document.getElementById('form-create-doc');
        const btnCancelCreate = document.getElementById('btn-cancel-create');

        // Función para ocultar todas las secciones
        function hideAllSections() {
            sectionCreate.style.display = 'none';
            sectionDrive.innerHTML = '';
            sectionGoogleDrive.innerHTML = '';
            sectionImported.innerHTML = '';
            feedback.innerHTML = '';
        }

        if (btnLogout) {
            btnLogout.addEventListener('click', () => {
                try { localStorage.removeItem('token'); } catch (e) {}
                window.location.href = "{% url 'login' %}";
            });
        }

        // Cargar perfil para encabezado
        fetch("{% url 'profile' %}", {
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(r => r.ok ? r.json() : Promise.reject(r)).then(data => {
            const nameEl = document.querySelector('.Head-Detalles h3');
            const membershipEl = document.querySelector('.Head-Detalles span');
            if (nameEl && data.user && data.user.username) nameEl.textContent = data.user.username;
            if (membershipEl && data.user && data.user.membership) membershipEl.textContent = data.user.membership;
        }).catch(() => {});

        function renderUserFiles(files) {
            if (!Array.isArray(files)) files = [];
            const rows = files.map(f => `
                <tr>
                    <td>${f.title || ''}</td>
                    <td>${f.type || ''}</td>
                    <td>${f.google_drive_id || ''}</td>
                    <td>
                        <a href="${f.google_drive_url || '#'}" target="_blank" class="btn-view">Ver en Drive</a>
                        ${f.type === 'EXCEL' ? `<button data-docid="${f.id}" class="btn-view-rows">Ver Filas (${f.rows_count || 0})</button>` : ''}
                    </td>
                </tr>
            `).join('');
            sectionDrive.innerHTML = `
                <h2>Mis Archivos Creados (${files.length})</h2>
                <table class="Listar-Archivos">
                    <thead>
                        <tr><th>Título</th><th>Tipo</th><th>Drive ID</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>${rows || '<tr><td colspan="4">No tienes archivos creados</td></tr>'}</tbody>
                </table>
            `;
            
            // Agregar event listeners para ver filas de Excel
            sectionDrive.querySelectorAll('.btn-view-rows').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const docId = btn.getAttribute('data-docid');
                    if (!docId) return;
                    try {
                        const res = await fetch(`/api/documents/${docId}/rows`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        if (res.ok) {
                            showExcelRows(data);
                        } else {
                            alert(data.error || 'Error al obtener filas');
                        }
                    } catch (e) {
                        alert('Error de red al obtener filas');
                    }
                });
            });
        }

        function renderGoogleDriveFiles(files) {
            if (!Array.isArray(files)) files = [];
            const rows = files.map(f => `
                <tr>
                    <td>${f.name || ''}</td>
                    <td>${f.type || ''}</td>
                    <td>${f.size ? (f.size / 1024).toFixed(1) + ' KB' : 'N/A'}</td>
                    <td>${f.modified || ''}</td>
                    <td><button data-fileid="${f.id || ''}" class="btn-import">Importar</button></td>
                </tr>
            `).join('');
            sectionGoogleDrive.innerHTML = `
                <h2>Archivos en Google Drive (${files.length})</h2>
                <table class="Listar-Archivos">
                    <thead>
                        <tr><th>Nombre</th><th>Tipo</th><th>Tamaño</th><th>Modificado</th><th>Acción</th></tr>
                    </thead>
                    <tbody>${rows || '<tr><td colspan="5">No se encontraron archivos</td></tr>'}</tbody>
                </table>
            `;
            sectionGoogleDrive.querySelectorAll('.btn-import').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const fileId = btn.getAttribute('data-fileid');
                    if (!fileId) return;
                    try {
                        const res = await fetch(`${"{% url 'import_file' file_id='FILE_ID' %}".replace('FILE_ID', fileId)}`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        if (res.ok) {
                            feedback.innerHTML = `<div class="success">✅ Importado: ${data.document && data.document.title ? data.document.title : 'OK'}</div>`;
                        } else {
                            feedback.innerHTML = `<div class="error">❌ ${data.error || 'Error al importar'}</div>`;
                        }
                    } catch (e) {
                        feedback.innerHTML = `<div class="error">❌ Error de red al importar</div>`;
                    }
                });
            });
        }

        function renderImported(docs) {
            if (!Array.isArray(docs)) docs = [];
            const rows = docs.map(d => `
                <tr>
                    <td>${d.title || ''}</td>
                    <td>${d.type || ''}</td>
                    <td>${d.google_drive_id || ''}</td>
                    <td>${d.imported_at ? new Date(d.imported_at).toLocaleDateString() : ''}</td>
                    <td>
                        <a href="${d.google_drive_url || '#'}" target="_blank" class="btn-view">Ver en Drive</a>
                    </td>
                </tr>
            `).join('');
            sectionImported.innerHTML = `
                <h2>Documentos Importados (${docs.length})</h2>
                <table class="Listar-Archivos">
                    <thead>
                        <tr><th>Título</th><th>Tipo</th><th>Drive ID</th><th>Importado</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>${rows || '<tr><td colspan="5">No tienes documentos importados</td></tr>'}</tbody>
                </table>
            `;
        }

        function showExcelRows(data) {
            const rows = data.rows || [];
            const rowsHtml = rows.map(row => {
                const cells = Object.entries(row.data).map(([key, value]) => 
                    `<td><strong>${key}:</strong> ${value}</td>`
                ).join('');
                return `<tr><td>${row.row_number}</td>${cells}</tr>`;
            }).join('');
            
            feedback.innerHTML = `
                <div class="excel-rows">
                    <h3>Filas del documento: ${data.document.title}</h3>
                    <p>Total de filas: ${data.rows_count}</p>
                    <table class="Listar-Archivos">
                        <thead>
                            <tr><th>Fila #</th><th>Datos</th></tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            `;
        }

        // Event listeners para botones principales
        btnCreate.addEventListener('click', () => {
            hideAllSections();
            sectionCreate.style.display = 'block';
        });

        btnCancelCreate.addEventListener('click', () => {
            hideAllSections();
            formCreateDoc.reset();
        });

        formCreateDoc.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(formCreateDoc);
            const title = formData.get('title');
            const type = formData.get('type');
            
            try {
                const res = await fetch("{% url 'create_document' %}", {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, type })
                });
                const data = await res.json();
                if (res.ok) {
                    const link = data.document && data.document.url ? data.document.url : '#';
                    feedback.innerHTML = `
                        <div class="success">
                            ✅ Documento "${title}" creado exitosamente<br>
                            <a href="${link}" target="_blank" class="btn-view">Abrir en Google Drive</a>
                        </div>
                    `;
                    formCreateDoc.reset();
                    sectionCreate.style.display = 'none';
                } else {
                    feedback.innerHTML = `<div class="error">❌ ${data.error || 'Error al crear documento'}</div>`;
                }
            } catch (e) {
                feedback.innerHTML = `<div class="error">❌ Error de red al crear documento</div>`;
            }
        });

        btnListDrive.addEventListener('click', async () => {
            hideAllSections();
            try {
                const res = await fetch("{% url 'list_files' %}", {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    renderUserFiles(data.files || data);
                } else {
                    feedback.innerHTML = `<div class="error">❌ ${data.error || 'Error al listar archivos'}</div>`;
                }
            } catch (e) {
                feedback.innerHTML = `<div class="error">❌ Error de red al listar archivos</div>`;
            }
        });

        btnListGoogleDrive.addEventListener('click', async () => {
            hideAllSections();
            try {
                const res = await fetch("{% url 'list_google_drive_files' %}", {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    renderGoogleDriveFiles(data.files || data);
                } else {
                    feedback.innerHTML = `<div class="error">❌ ${data.error || 'Error al listar archivos de Google Drive'}</div>`;
                }
            } catch (e) {
                feedback.innerHTML = `<div class="error">❌ Error de red al listar archivos de Google Drive</div>`;
            }
        });

        btnListImported.addEventListener('click', async () => {
            hideAllSections();
            try {
                const res = await fetch("{% url 'list_user_documents' %}", {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    renderImported(data.documents || data);
                } else {
                    feedback.innerHTML = `<div class="error">❌ ${data.error || 'Error al obtener documentos'}</div>`;
                }
            } catch (e) {
                feedback.innerHTML = `<div class="error">❌ Error de red al obtener documentos</div>`;
            }
        });
    })();
    </script>
</body>
</html>
